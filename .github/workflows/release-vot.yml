name: Release YouTube VOT

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-vot
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(node -p "require('./vot-mod/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Release v$version already exists, nothing to do." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.version.outputs.exists == 'false'
        with:
          node-version: lts/*
          cache: npm

      - name: Build
        if: steps.version.outputs.exists == 'false'
        run: node vot-mod/patch.cjs

      - name: Test
        if: steps.version.outputs.exists == 'false'
        working-directory: vot-mod
        run: |
          npm test
          npm run typecheck

      - name: Publish release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          awk -v v="## $VERSION" '$0 == v {on = 1; next} /^## / {on = 0} on' vot-mod/project/CHANGELOG.md > notes.md
          printf '\nHomebrew Channel: https://tinyurl.com/ytvot-tv\n' >> notes.md
          gh release create "v$VERSION" dist/youtube.leanback.v4_*_all.ipk \
            --target "$GITHUB_SHA" --title "YouTube VOT $VERSION" --notes-file notes.md

      - name: Update repo.json
        if: steps.version.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo.json vot-mod/repo.json
          git commit -m "Release v$VERSION [skip ci]"
          git push origin HEAD:main
